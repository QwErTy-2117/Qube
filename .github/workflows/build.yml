name: Build and Release Qube Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # Automated proof that the app works on Linux/Windows/macOS without owning
  # hardware or asking humans: GitHub runs this matrix on real ephemeral
  # runners for each OS. No local RAM/VMs needed. If this job is green, unit
  # logic + typecheck + Rust + Next.js sidecar boot all passed natively.
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: windows-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxtst-dev \
            patchelf \
            rpm \
            libfuse2 \
            zsync \
            xdg-utils \
            pkgconf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Create .env with secrets
        # NOTE: forced bash so `>` writes LF/UTF-8 identically on
        # Linux/macOS/Windows (pwsh echo would write UTF-16 and break dotenv).
        shell: bash
        run: echo "COMPOSIO_API_KEY=${{ secrets.COMPOSIO_API_KEY }}" > .env

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests (Node)
        # NOTE: package.json test uses `QUBE_DATA_DIR=$(mktemp -d)` (bash
        # syntax). Forced bash so the same command works on windows-latest
        # via git-bash instead of failing under pwsh.
        shell: bash
        run: npm test

      - name: Rust tests
        shell: bash
        working-directory: src-tauri
        run: cargo test

      - name: Build sidecar
        shell: bash
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
        run: node scripts/build-sidecar.js

      - name: Smoke test sidecar (bundled Node boots + responds)
        # Proves the exact artifact Tauri ships: sidecar-dist/server.js started
        # with the BUNDLED node-bin binary (what user machines without Node.js
        # will use), from the same cwd layout Rust uses. Catches missing node
        # binary, wrong arch, lost exec bit, Windows-junction, path, and
        # PORT/HOSTNAME bugs that `npm run dev` on Linux never shows. Any HTTP
        # status counts — even 404 proves the TCP+HTTP stack is up.
        shell: bash
        env:
          PORT: 3010
          HOSTNAME: 127.0.0.1
          QUBE_DATA_DIR: ${{ runner.temp }}/qube-data-smoke
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
        run: |
          mkdir -p "$QUBE_DATA_DIR"
          test -f sidecar-dist/server.js
          pushd sidecar-dist >/dev/null
          if [ -f "node-bin/node.exe" ]; then BIN="node-bin/node.exe"; else BIN="node-bin/node"; fi
          test -f "$BIN" || { echo "bundled node missing ($BIN)"; exit 1; }
          "$BIN" --version
          PORT=3010 HOSTNAME=127.0.0.1 QUBE_DATA_DIR="$QUBE_DATA_DIR" "$BIN" server.js & echo $! > /tmp/qube-sidecar.pid
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:3010/ >/dev/null 2>&1; then
              echo "sidecar responded on attempt $i"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "sidecar never responded within 60s"
              kill "$(cat /tmp/qube-sidecar.pid)" || true
              popd >/dev/null || true
              exit 1
            fi
            sleep 2
          done
          kill "$(cat /tmp/qube-sidecar.pid)" || true
          popd >/dev/null

  build:
    needs: test
    permissions:
      contents: write
    strategy:
      # Do not cancel Windows/macOS when Linux fails (default fail-fast:true
      # cancelled both in v0.0.34). Tauri docs recommend 22.04 as the Linux
      # baseline for AppImage/glibc compat.
      fail-fast: false
      matrix:
        include:
          # Linux builds deb+rpm only: AppImage/linuxdeploy fails on GH
          # runners with opaque `failed to run linuxdeploy` even on 22.04
          # with all documented deps (webkit 2.50, pkgconf, libfuse2,
          # APPIMAGE_EXTRACT_AND_RUN). deb+rmm bundle reliably; updater
          # artifacts (tar.gz+sig) are still produced via
          # createUpdaterArtifacts. To debug AppImage, temporarily set Linux
          # args to '--verbose' and run via workflow_dispatch.
          - os: ubuntu-22.04
            args: '--bundles deb,rpm'
          - os: windows-latest
            args: ''
          - os: macos-latest
            args: ''
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: swatinem/rust-cache@v2
        with:
          # Default workspace root has no Cargo.toml (ours lives in
          # src-tauri/). Without this the step fails with
          # "could not find Cargo.toml" and always misses cache.
          # Matches Tauri's official GitHub workflow guide.
          workspaces: './src-tauri -> target'

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxtst-dev \
            patchelf \
            rpm \
            libfuse2 \
            zsync \
            xdg-utils \
            pkgconf
            # NOTE: pkgconf is a hard requirement of linuxdeploy-plugin-gtk.sh
            # (fetched unpinned from master at bundle time — it aborts with
            # "pkg-config/pkgconf not found in PATH" without it, surfacing
            # only as Tauri's opaque `failed to run linuxdeploy`). libfuse2
            # + file + zsync + xdg-utils + APPIMAGE_EXTRACT_AND_RUN below cover
            # the FUSE-less runner side of AppImage bundling. Ubuntu 22.04 uses
            # libfuse2 (24.04 renamed it libfuse2t64).

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Create .env with secrets
        run: echo "COMPOSIO_API_KEY=${{ secrets.COMPOSIO_API_KEY }}" > .env

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # linuxdeploy/appimagetool need this on runners without FUSE
          APPIMAGE_EXTRACT_AND_RUN: 1
        with:
          tagName: v__VERSION__
          releaseName: "Qube v__VERSION__"
          releaseBody: "See the assets to download this version."
          releaseDraft: false
          prerelease: false
          # NOTE: v1 input is `uploadUpdaterJson`, not `includeUpdaterJson`
          # (the latter logs "Unexpected input" and is silently ignored).
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
          # AppImage bundling downloads unpinned third-party tools
          # (linuxdeploy, appimagetool, gtk plugins) at build time; a single
          # retry absorbs transient network flakes without masking real
          # errors (the log still shows the first failure).
          retryAttempts: 1
