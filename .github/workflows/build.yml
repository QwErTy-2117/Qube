name: Build and Release Qube Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # Automated proof that the app works on Linux/Windows/macOS without owning
  # hardware or asking humans: GitHub runs this matrix on real ephemeral
  # runners for each OS. No local RAM/VMs needed. If this job is green, unit
  # logic + typecheck + Rust + Next.js sidecar boot all passed natively.
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: windows-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxtst-dev \
            patchelf \
            rpm \
            libfuse2 \
            zsync \
            xdg-utils \
            pkgconf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Create .env with secrets
        # NOTE: forced bash so `>` writes LF/UTF-8 identically on
        # Linux/macOS/Windows (pwsh echo would write UTF-16 and break dotenv).
        shell: bash
        run: echo "COMPOSIO_API_KEY=${{ secrets.COMPOSIO_API_KEY }}" > .env

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests (Node)
        # NOTE: package.json test runs via node scripts/run-tests.mjs
        # (cross-platform temp dir, no bash-isms) so npm's cmd.exe script
        # shell on windows-latest works. Kept on bash for uniform logs.
        shell: bash
        run: npm test

      - name: Build sidecar
        # NOTE: must run BEFORE `cargo test` — tauri-build reads
        # tauri.conf.json `resources: ["../sidecar-dist/**/*"]` and fails
        # with `glob pattern ../sidecar-dist/**/* path not found` when the
        # dir is missing (macOS failure on v0.0.46). Same order as Tauri's
        # beforeBuildCommand.
        shell: bash
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
        run: node scripts/build-sidecar.js

      - name: Rust tests
        shell: bash
        working-directory: src-tauri
        run: cargo test

      - name: Smoke test sidecar (bundled Node boots + responds)
        # Proves the exact artifact Tauri ships: sidecar-dist/server.js started
        # with the BUNDLED node-bin binary (what user machines without Node.js
        # will use), from the same cwd layout Rust uses. Catches missing node
        # binary, wrong arch, lost exec bit, Windows-junction, path, and
        # PORT/HOSTNAME bugs that `npm run dev` on Linux never shows. Any HTTP
        # status counts — even 404 proves the TCP+HTTP stack is up.
        shell: bash
        env:
          PORT: 3010
          HOSTNAME: 127.0.0.1
          QUBE_DATA_DIR: ${{ runner.temp }}/qube-data-smoke
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
        run: |
          mkdir -p "$QUBE_DATA_DIR"
          test -f sidecar-dist/server.js
          pushd sidecar-dist >/dev/null
          if [ -f "node-bin/node.exe" ]; then BIN="node-bin/node.exe"; else BIN="node-bin/node"; fi
          test -f "$BIN" || { echo "bundled node missing ($BIN)"; exit 1; }
          "$BIN" --version
          PORT=3010 HOSTNAME=127.0.0.1 QUBE_DATA_DIR="$QUBE_DATA_DIR" "$BIN" server.js & echo $! > /tmp/qube-sidecar.pid
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:3010/ >/dev/null 2>&1; then
              echo "sidecar responded on attempt $i"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "sidecar never responded within 60s"
              kill "$(cat /tmp/qube-sidecar.pid)" || true
              popd >/dev/null || true
              exit 1
            fi
            sleep 2
          done
          kill "$(cat /tmp/qube-sidecar.pid)" || true
          popd >/dev/null

      - name: Smoke test browser MCP (bundled server boots + lists tools)
        # Turns the Windows production symptom "browser use MCP fails to
        # start" into a per-OS gate: boots sidecar-dist/node-bin/node with
        # sidecar-dist/lib/browser/auto-mcp/server.mjs (the exact artifacts
        # Tauri ships -- not repo copies) and asserts tools/list returns the
        # browser tools. Catches missing script, missing `ws`, wrong node
        # arch, or bad perms in the bundle on the OS where it breaks.
        shell: bash
        run: node scripts/smoke-mcp.js sidecar-dist

  build:
    needs: test
    permissions:
      contents: write
    strategy:
      # Do not cancel Windows/macOS when Linux fails (default fail-fast:true
      # cancelled both in v0.0.34). Tauri docs recommend 22.04 as the Linux
      # baseline for Linux/glibc compat.
      fail-fast: false
      matrix:
        include:
          # Linux x64: deb+rpm.
          - os: ubuntu-22.04
            args: '--bundles deb,rpm'
            label: linux-x64
          # Linux ARM64: native arm runner, same deb+rpm formats.
          - os: ubuntu-22.04-arm
            args: '--bundles deb,rpm'
            label: linux-arm64
          # Windows x64: NSIS + MSI so both install bases update in place.
          - os: windows-latest
            args: ''
            label: windows-x64
          # Windows ARM64: NSIS only (WiX/MSI ARM64 support is inconsistent).
          - os: windows-11-arm
            args: '--bundles nsis'
            label: windows-arm64
          # macOS Apple Silicon (native arm runner).
          - os: macos-15
            args: ''
            label: macos-arm64
          # macOS Intel (x64). Skip DMG: the Intel runner's hdiutil hangs
          # for ~8 minutes (`diskimages-help` orphans) and then fails.
          # `app` still produces Qube.app + the signed .app.tar.gz updater
          # artifact; a .zip is uploaded below for manual installs.
          - os: macos-15-intel
            args: '--bundles app'
            label: macos-x64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: swatinem/rust-cache@v2
        with:
          # Default workspace root has no Cargo.toml (ours lives in
          # src-tauri/). Without this the step fails with
          # "could not find Cargo.toml" and always misses cache.
          # Matches Tauri's official GitHub workflow guide.
          workspaces: './src-tauri -> target'

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxtst-dev \
            patchelf \
            rpm \
            pkgconf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Create .env with secrets
        # Force bash so `>` writes LF/UTF-8 on Windows too; pwsh writes
        # UTF-16 and the sidecar's dotenv reader then misses COMPOSIO_API_KEY.
        shell: bash
        run: echo "COMPOSIO_API_KEY=${{ secrets.COMPOSIO_API_KEY }}" > .env

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Qube v__VERSION__"
          releaseBody: "See the assets to download this version."
          releaseDraft: false
          prerelease: false
          # NOTE: v1 input is `uploadUpdaterJson`, not `includeUpdaterJson`
          # (the latter logs "Unexpected input" and is silently ignored).
          # Undefined matrix values compare equal to false in GitHub
          # expressions; keep this literal so latest.json is always uploaded.
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
          # A single retry absorbs transient network flakes (tool downloads,
          # crates) without masking real errors; the log keeps the first failure.
          retryAttempts: 1

      - name: Package macOS x64 app (DMG workaround)
        # The Intel runner's hdiutil DMG step hangs on hosted CI. Ship the
        # built Qube.app as a zip in addition to the signed .app.tar.gz
        # updater artifact produced by Tauri.
        if: matrix.label == 'macos-x64'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          TAG="v${VERSION}"
          ditto -c -k --sequesterRsrc --keepParent \
            "src-tauri/target/release/bundle/macos/Qube.app" \
            "Qube_${VERSION}_x64.app.zip"
          # Ensure the release exists before uploading: tauri-action creates it
          # in whichever matrix job runs first, but a parallel job can hit
          # "release not found" if the release isn't visible yet. Derive its
          # tag from Tauri's version so workflow_dispatch works from a branch
          # ref as well as the usual version-tag trigger.
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" \
              --title "Qube v${VERSION}" \
              --notes "See the assets to download this version." || true
          fi
          gh release upload "${TAG}" "Qube_${VERSION}_x64.app.zip" --clobber

      - name: Smoke test bundled sidecar
        # Prove the exact artifact this runner just packaged boots and serves
        # HTTP — catches wrong-arch node, missing sidecar files, and lost exec
        # bits on every release target (including ARM).
        shell: bash
        env:
          PORT: 3010
          HOSTNAME: 127.0.0.1
          QUBE_DATA_DIR: ${{ runner.temp }}/qube-data-smoke
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
        run: |
          mkdir -p "$QUBE_DATA_DIR"
          test -f sidecar-dist/server.js
          pushd sidecar-dist >/dev/null
          if [ -f "node-bin/node.exe" ]; then BIN="node-bin/node.exe"; else BIN="node-bin/node"; fi
          test -f "$BIN" || { echo "bundled node missing ($BIN)"; exit 1; }
          "$BIN" --version
          PORT=3010 HOSTNAME=127.0.0.1 QUBE_DATA_DIR="$QUBE_DATA_DIR" "$BIN" server.js & echo $! > /tmp/qube-sidecar.pid
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:3010/ >/dev/null 2>&1; then
              echo "sidecar responded on attempt $i"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "sidecar never responded within 60s"
              kill "$(cat /tmp/qube-sidecar.pid)" || true
              popd >/dev/null || true
              exit 1
            fi
            sleep 2
          done
          kill "$(cat /tmp/qube-sidecar.pid)" || true
          popd >/dev/null

      - name: Smoke test browser MCP
        shell: bash
        run: node scripts/smoke-mcp.js sidecar-dist
