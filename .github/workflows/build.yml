name: Build and Release Qube Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      # Do not cancel Windows/macOS when Linux fails (default fail-fast:true
      # cancelled both in v0.0.34). Tauri docs also recommend 22.04 as the
      # Linux baseline: oldest supported base for AppImage/glibc compat and
      # the runner linuxdeploy is tested on. 24.04 (glibc 2.39, webkit 2.52)
      # fails AppImage bundling with opaque `failed to run linuxdeploy`.
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: swatinem/rust-cache@v2
        with:
          # Default workspace root has no Cargo.toml (ours lives in
          # src-tauri/). Without this the step fails with
          # "could not find Cargo.toml" and always misses cache.
          # Matches Tauri's official GitHub workflow guide.
          workspaces: './src-tauri -> target'

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxtst-dev \
            patchelf \
            rpm \
            libfuse2 \
            zsync \
            xdg-utils \
            pkgconf
            # NOTE: pkgconf is a hard requirement of linuxdeploy-plugin-gtk.sh
            # (fetched unpinned from master at bundle time — it aborts with
            # "pkg-config/pkgconf not found in PATH" without it, surfacing
            # only as Tauri's opaque `failed to run linuxdeploy`). libfuse2
            # + file + zsync + xdg-utils + APPIMAGE_EXTRACT_AND_RUN below cover
            # the FUSE-less runner side of AppImage bundling. Ubuntu 22.04 uses
            # libfuse2 (24.04 renamed it libfuse2t64).

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Create .env with secrets
        run: echo "COMPOSIO_API_KEY=${{ secrets.COMPOSIO_API_KEY }}" > .env

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # linuxdeploy/appimagetool need this on runners without FUSE
          APPIMAGE_EXTRACT_AND_RUN: 1
        with:
          tagName: v__VERSION__
          releaseName: "Qube v__VERSION__"
          releaseBody: "See the assets to download this version."
          releaseDraft: false
          prerelease: false
          # NOTE: v1 input is `uploadUpdaterJson`, not `includeUpdaterJson`
          # (the latter logs "Unexpected input" and is silently ignored).
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          # AppImage bundling downloads unpinned third-party tools
          # (linuxdeploy, appimagetool, gtk plugins) at build time; a single
          # retry absorbs transient network flakes without masking real
          # errors (the log still shows the first failure).
          retryAttempts: 1
          # If the Linux job ever fails again with only
          # `failed to run linuxdeploy` and no detail, temporarily add
          # `args: '--verbose'` here and re-run via workflow_dispatch: verbose
          # mode prints the underlying linuxdeploy/plugin stderr that Tauri
          # otherwise swallows.
